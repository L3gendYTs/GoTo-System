plugins {
    id 'java'
    id("io.github.goooler.shadow") version "8.1.7"
}

apply plugin: 'java'

group = 'me.l3gend'
version = rootProject.version

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        url 'https://repo.codemc.org/repository/maven-public/'
    }
    maven {url = 'https://jitpack.io'}
}

dependencies {
    compileOnly 'com.velocitypowered:velocity-api:4.3.0'
    annotationProcessor 'com.velocitypowered:velocity-api:4.3.0'

    implementation 'it.mycraft:powerlib-velocity:1.2.16-SNAPSHOT'
}

configurations {
    all*.exclude group: 'org.jetbrains.kotlin'
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(25))
}

tasks {
    compileJava {
        dependsOn clean
        options.encoding = 'UTF-8'
    }
    build {
        dependsOn shadowJar
    }
}

shadowJar{
    archiveFileName = 'goto-velocity.jar'
}

