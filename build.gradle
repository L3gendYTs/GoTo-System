plugins {
    id 'java'
    id("io.github.goooler.shadow") version "8.1.7"
}

apply plugin: "java"

group = 'me.l3gend'
version = '2.0'

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(25))
}

allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
        maven {url = 'https://jitpack.io'}
        maven {
            url 'https://repo.codemc.org/repository/maven-public/'
        }
    }
}

subprojects {
    apply plugin: 'java'

    dependencies {
        compileOnly('org.projectlombok:lombok:1.18.44')
        annotationProcessor('org.projectlombok:lombok:1.18.44')
    }
}

dependencies {
    implementation project(":goto-bungee")
    implementation project(":goto-velocity")
}

tasks {
    compileJava {
        dependsOn clean
        options.encoding = 'UTF-8'
    }
    build {
        dependsOn shadowJar
    }
}

shadowJar {
    archiveBaseName.set('GoTo-System')
    archiveVersion.set(version)
    mergeServiceFiles()
}

tasks.named('build') {
    dependsOn(shadowJar)
}
